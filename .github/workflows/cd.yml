name: CD

on:
  push:
    branches: [main]

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  push:
    name: Push / ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: auth
            context: apps/services/auth
            image: darko999/auth-service
          - service: book
            context: apps/services/book
            image: darko999/book-service
          - service: gateway
            context: apps/services/gateway
            image: darko999/api-gateway
          - service: inventory
            context: apps/services/inventory
            image: darko999/inventory-service
          - service: notification
            context: apps/services/notification
            image: darko999/notification-service
          - service: order
            context: apps/services/order
            image: darko999/order-service
          - service: frontend
            context: apps/frontend
            image: darko999/frontend

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ matrix.image }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  update-tags:
    name: Update image tags
    runs-on: ubuntu-latest
    needs: push
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in dev overlay
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          if [ ! -f deploy/overlays/dev/kustomization.yaml ]; then
            echo "kustomization.yaml not yet created — skipping tag update"
            exit 0
          fi
          cd deploy/overlays/dev
          kustomize edit set image \
            darko999/auth-service=darko999/auth-service:${SHORT_SHA} \
            darko999/book-service=darko999/book-service:${SHORT_SHA} \
            darko999/api-gateway=darko999/api-gateway:${SHORT_SHA} \
            darko999/inventory-service=darko999/inventory-service:${SHORT_SHA} \
            darko999/notification-service=darko999/notification-service:${SHORT_SHA} \
            darko999/order-service=darko999/order-service:${SHORT_SHA} \
            darko999/frontend=darko999/frontend:${SHORT_SHA}

      - name: Commit updated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/dev/kustomization.yaml 2>/dev/null || true
          git diff --staged --quiet || git commit -m "ci: update image tags to $(echo ${{ github.sha }} | cut -c1-7)"
          git push
