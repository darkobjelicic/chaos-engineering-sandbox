name: CD

on:
  repository_dispatch:
    types: [bookstore-image-published]

concurrency:
  group: cd-main
  cancel-in-progress: false

jobs:
  update-tags:
    name: Update image tags
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update image tags in kind overlay
        run: |
          SHORT_SHA=$(echo "${{ github.event.client_payload.sha }}" | cut -c1-7)
          cd deploy/overlays/kind
          kustomize edit set image \
            darko999/auth-service=darko999/auth-service:${SHORT_SHA} \
            darko999/book-service=darko999/book-service:${SHORT_SHA} \
            darko999/api-gateway=darko999/api-gateway:${SHORT_SHA} \
            darko999/inventory-service=darko999/inventory-service:${SHORT_SHA} \
            darko999/notification-service=darko999/notification-service:${SHORT_SHA} \
            darko999/order-service=darko999/order-service:${SHORT_SHA} \
            darko999/frontend=darko999/frontend:${SHORT_SHA}

      - name: Commit updated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays/kind/kustomization.yaml
          git diff --staged --quiet || git commit -m "ci: update image tags to $(echo ${{ github.event.client_payload.sha }} | cut -c1-7)"
          git push
