apiVersion: chaos-mesh.org/v1alpha1
kind: HTTPChaos
metadata:
  name: http-500-order
  namespace: bookstore
spec:
  mode: all
  selector:
    namespaces:
      - bookstore
    labelSelectors:
      app: order-service
  target: Response
  port: 8000
  path: "*"
  replace:
    code: 500
  duration: 2m
