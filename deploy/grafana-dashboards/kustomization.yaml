apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

generatorOptions:
  disableNameSuffixHash: true
  labels:
    grafana_dashboard: "1"

configMapGenerator:
  - name: bookstore-overview-dashboard
    files:
      - bookstore-overview.json
  - name: service-detail-dashboard
    files:
      - service-detail.json
