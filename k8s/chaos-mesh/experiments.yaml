apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: kill-order-service-pod
  namespace: default
spec:
  action: pod-kill
  mode: one
  duration: "30s"
  scheduler:
    cron: "@every 2m"
  selector:
    namespaces:
      - default
    labelSelectors:
      app: order-service
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: order-to-inventory-delay
  namespace: default
spec:
  action: delay
  mode: all
  duration: "1m"
  scheduler:
    cron: "@every 3m"
  delay:
    latency: "500ms"
    jitter: "100ms"
  direction: to
  target:
    namespace: default
    selector:
      app: inventory-service
  source:
    namespace: default
    selector:
      app: order-service
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: rabbitmq-packet-loss
  namespace: default
spec:
  action: loss
  mode: all
  duration: "45s"
  scheduler:
    cron: "@every 5m"
  loss:
    loss: "5%"
    correlation: "25%"
  direction: both
  target:
    namespace: default
    selector:
      app: rabbitmq
---
apiVersion: chaos-mesh.org/v1alpha1
kind: StressChaos
metadata:
  name: cpu-stress-auth-service
  namespace: default
spec:
  action: stress
  duration: "1m"
  scheduler:
    cron: "@every 4m"
  stressors:
    cpu:
      workers: 2
      load: 80
  mode: one
  selector:
    namespaces:
      - default
    labelSelectors:
      app: auth-service
---
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: notification-service-pod-failure
  namespace: default
spec:
  action: pod-failure
  mode: one
  duration: "45s"
  scheduler:
    cron: "@every 6m"
  selector:
    namespaces:
      - default
    labelSelectors:
      app: notification-service
