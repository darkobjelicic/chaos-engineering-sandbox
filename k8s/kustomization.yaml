apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: bookstore-base

resources:
  # Traefik & Cert-Manager
  - traefik/namespace.yaml
  - traefik/deployment.yaml
  - traefik/service.yaml
  - traefik/ingressroutes.yaml
  - traefik/monitoring-ingressroutes.yaml
  - cert-manager/issuer.yaml
  
  # Base namespace & databases
  - base/namespace.yaml
  - base/postgres/deployment.yaml
  - base/rabbitmq/deployment.yaml
  
  # Microservices
  - base/auth-service/deployment.yaml
  - base/book-service/deployment.yaml
  - base/order-service/deployment.yaml
  - base/inventory-service/deployment.yaml
  - base/notification-service/deployment.yaml
  - base/gateway/deployment.yaml
  - base/frontend/deployment.yaml
  
  # Monitoring
  - monitoring/deployment.yaml
  
  # Load Testing
  - locust/deployment.yaml
  
  # Chaos Experiments
  - chaos-mesh/experiments.yaml

namespace: default

commonLabels:
  app.kubernetes.io/part-of: bookstore
  app.kubernetes.io/managed-by: kustomize

commonAnnotations:
  app.kubernetes.io/version: "1.0.0"
